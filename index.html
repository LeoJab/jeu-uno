<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uno · ChadGang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2433f2; --blue2:#1a26c9; --yellow:#ffd426; --ink:#12102b; --white:#fff;
  --r:#ff4757; --y:#ffc312; --g:#20bf6b; --b:#1e90ff; --k:#1b1838;
  --cur:#ffd426;
  --cw:clamp(56px, 14.5vw, 94px);
  --pw:clamp(68px, 17vw, 112px);
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
:root{--bg:radial-gradient(circle,rgba(255,255,255,.2) 1.4px,transparent 1.9px) 11px 11px/22px 22px fixed,linear-gradient(225deg,#2c42f6 0%,#2433f2 40%,#1f2be6 100%) fixed var(--blue)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:800}
button{font:inherit;cursor:pointer;color:var(--ink)}
.hidden{display:none!important}
.screen{position:absolute;inset:0;height:100dvh;display:flex;flex-direction:column}

/* ---------- boutons / panneaux style hub ---------- */
.btn{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:10px 16px;font-weight:900;font-size:16px;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.white{background:#fff}.btn.red{background:var(--r);color:#fff}.btn.green{background:var(--g);color:#fff}.btn.ink{background:var(--ink);color:#fff}
.btn.small{padding:6px 10px;font-size:14px;border-radius:11px;box-shadow:3px 3px 0 var(--ink)}
.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:19px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.icon:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.panel{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:18px}
input[type=text]{font:inherit;font-weight:900;font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);outline:none;min-width:0}
input[type=text]:focus{box-shadow:3px 3px 0 var(--ink)}

/* ---------- accueil ---------- */
#home{overflow-y:auto;align-items:center;padding:20px 16px 40px}
#home > *{flex:none}
.logo{font-family:var(--display);font-size:clamp(70px,22vw,140px);line-height:.9;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);transform:rotate(-6deg);margin:18px 0 0;letter-spacing:2px;user-select:none}
.logo span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.logo span:nth-child(1){color:var(--r)}.logo span:nth-child(2){color:var(--yellow);animation-delay:.15s}.logo span:nth-child(3){color:var(--g);animation-delay:.3s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-14px) rotate(-4deg)}}
.tag{position:relative;z-index:5;background:var(--ink);color:var(--yellow);font-weight:900;padding:5px 14px;border-radius:999px;transform:rotate(-3deg);margin:14px 0 6px;font-size:14px;letter-spacing:1px}
.homegrid{display:grid;gap:18px;width:100%;max-width:440px}
.homegrid h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px;letter-spacing:.5px}
.homegrid p{margin:0 0 12px;font-size:14px;opacity:.75}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.fan{position:relative;height:120px;width:200px;margin:14px auto 26px}
.fan .card{position:absolute;left:50%;bottom:0;--cw:64px;transform-origin:50% 120%}

/* ---------- barre du haut ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;flex:none}
#topbar .chip{flex:0 1 auto;min-width:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px;border:3px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .chip.code{flex:none;background:var(--yellow);color:var(--ink);cursor:pointer;letter-spacing:1px}
#topbar .spacer{flex:1}
#topbar .icon{width:36px;height:36px;font-size:17px}

#main{flex:1;min-height:0;display:flex}
#arena{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

/* ---------- table ---------- */
#table{position:relative;flex:1;min-height:200px}
#felt{position:absolute;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 40%,#3a4aff 0%,#1d28c6 62%,#121a96 100%);border:5px solid var(--ink);
  box-shadow:0 0 0 8px var(--cur),0 0 0 13px var(--ink),0 0 70px 16px color-mix(in srgb,var(--cur) 50%,transparent),inset 0 0 50px rgba(0,0,0,.4);transition:box-shadow .5s}
#spotWrap{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
#spot{position:absolute;left:50%;top:50%;width:220%;aspect-ratio:1;translate:-50% -50%;
  background:conic-gradient(from -26deg,rgba(255,212,38,.55),rgba(255,212,38,.15) 52deg,transparent 52deg);transition:rotate .6s cubic-bezier(.3,.7,.3,1),opacity .3s}
#dir{position:absolute;inset:0;pointer-events:none}
#dir svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#dir .ring{fill:none;stroke:rgba(255,255,255,.25);stroke-width:4;stroke-dasharray:14 12;stroke-linecap:round;animation:dash 1.6s linear infinite}
#dir.ccw .ring{animation-direction:reverse}
#dir .arw{fill:rgba(255,255,255,.6);stroke:var(--ink);stroke-width:1.5}
@keyframes dash{to{stroke-dashoffset:-52}}
@keyframes spin{to{transform:rotate(360deg)}}
#center{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:2}
#piles{display:flex;gap:clamp(14px,5vw,34px);align-items:center}
#deck,#pile{position:relative;width:var(--pw);height:calc(var(--pw)*1.46)}
#deck .card,#pile .card{position:absolute;inset:0;--cw:var(--pw)}
#deck{cursor:pointer}
#deck .card:nth-child(1){transform:translate(6px,6px)}#deck .card:nth-child(2){transform:translate(3px,3px)}
#deck.can .card:last-of-type{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:3px 3px 0 var(--ink),0 0 0 5px var(--yellow),0 0 28px 6px var(--yellow)}}
#deck .count{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:999px;font-size:11px;font-weight:900;padding:0 7px;z-index:3;white-space:nowrap}
#stackBadge{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);z-index:6;font-family:var(--display);font-size:clamp(28px,9vw,46px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap;animation:fire .5s ease-in-out infinite alternate;pointer-events:none}
@keyframes fire{from{transform:translate(-50%,-100%) scale(1) rotate(-3deg);filter:drop-shadow(0 0 8px #ff7b00)}to{transform:translate(-50%,-104%) scale(1.08) rotate(3deg);filter:drop-shadow(0 0 18px #ff3b00)}}
#tinfo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tchip{background:rgba(18,16,43,.8);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tchip .dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:var(--cur);transition:background .4s}
.tchip.hot{background:var(--r)}

/* ---------- sièges autour de la table ---------- */
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av{position:relative;overflow:hidden;width:32px;height:32px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;text-shadow:1px 1px 0 var(--ink);line-height:1}
#seats{position:absolute;inset:0;pointer-events:none}
.seat{position:absolute;translate:-50% -50%;pointer-events:auto;display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:6px 11px 6px 6px;transition:left .4s,top .4s,background .25s,scale .25s,box-shadow .25s;z-index:3;width:max-content;max-width:190px}
.seat.turn{background:var(--yellow);scale:1.12;z-index:6;box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 34px 10px rgba(255,212,38,.85)}
.seat.me{background:#e6e9ff}
.seat.me.turn{background:var(--yellow)}
.seat.away{opacity:.55;filter:grayscale(.7)}
.avw{position:relative;flex:none}
.seat .av{width:40px;height:40px;font-size:18px}
.seat.turn .av{animation:spinav 2.4s ease-in-out infinite}
@keyframes spinav{0%,70%,100%{rotate:0deg}80%{rotate:-12deg}90%{rotate:12deg}}
.cntb{position:absolute;right:-10px;bottom:-8px;min-width:25px;height:25px;padding:0 5px;border-radius:999px;background:var(--ink);color:#fff;border:2px solid #fff;font-family:var(--display);font-size:15px;display:grid;place-items:center;line-height:1;box-shadow:1px 1px 0 var(--ink)}
.seat.danger .cntb{background:var(--r);animation:pulse3 .7s ease-in-out infinite}
@keyframes pulse3{50%{scale:1.25}}
.seat .info{min-width:0}
.seat .nm{font-weight:900;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.seat .sub{font-size:11.5px;line-height:1.25;opacity:.75;white-space:nowrap;font-weight:800}
.minis{display:flex;height:18px;align-items:flex-end;margin-top:3px}
.mini{width:11px;height:16px;border-radius:3px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,var(--ink) 0 3px,#3a3580 3px 6px);margin-left:-5px}
.mini:first-child{margin-left:0}
.minis b{font-size:11px;margin-left:3px;line-height:16px}
.tag-turn{position:absolute;left:50%;top:-10px;translate:-50% -100%;background:var(--ink);color:var(--yellow);font-weight:900;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;animation:bob .8s ease-in-out infinite;letter-spacing:.5px}
.tag-turn::after{content:'';position:absolute;left:50%;bottom:-6px;translate:-50% 0;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.tbar{position:absolute;left:10px;right:10px;bottom:-4px;height:6px;border-radius:9px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--r);animation:tdown linear forwards}
@keyframes tdown{from{width:100%}to{width:0}}
.badge-uno{position:absolute;top:-12px;right:-10px;background:var(--r);color:#fff;font-family:var(--display);font-size:14px;padding:1px 8px;border-radius:999px;border:3px solid var(--ink);transform:rotate(8deg);animation:pulse .8s ease-in-out infinite;z-index:2}
@keyframes pulse{50%{transform:rotate(8deg) scale(1.15)}}
.catch{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:var(--r);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;z-index:7;animation:wob .35s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(4deg)}}
.bubble{position:absolute;left:50%;top:-6px;translate:-50% -100%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:1px 8px;font-size:26px;line-height:1.2;box-shadow:2px 2px 0 var(--ink);z-index:9;animation:bubble 2.3s ease forwards;pointer-events:none}
@keyframes bubble{0%{scale:.2;opacity:0}12%{scale:1.2;opacity:1}22%{scale:1}80%{opacity:1}100%{opacity:0;translate:-50% -150%}}

/* ---------- statut / actions / réactions ---------- */
#status{flex:none;display:flex;justify-content:center;padding:6px 10px 0;min-height:44px}
#status .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);padding:3px 16px 3px 3px;font-weight:900;font-size:clamp(14px,3.8vw,17px);max-width:100%;min-width:0}
#status .pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .pill .av{width:30px;height:30px;font-size:14px;border-width:2px}
#status .pill.me{background:var(--yellow);animation:popin .35s,pulse4 1.4s ease-in-out .35s infinite}
#status .pill.alert{background:var(--r);color:#fff}
@keyframes pulse4{50%{box-shadow:3px 3px 0 var(--ink),0 0 0 5px rgba(255,255,255,.7)}}
@keyframes popin{from{transform:scale(.7)}to{transform:scale(1)}}
#actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 10px 2px;min-height:50px;flex:none;align-items:center}
#unoBtn{font-family:var(--display);font-size:22px;background:var(--r);color:#fff;-webkit-text-stroke:1px var(--ink);letter-spacing:1px;padding:6px 18px}
#unoBtn.armed{background:var(--yellow);color:var(--ink);animation:pulse2 .6s ease-in-out infinite}
#unoBtn.urgent{animation:pulse2 .3s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.1) rotate(-3deg)}}
#reacts{flex:none;display:flex;justify-content:center;gap:6px;padding:2px 10px;overflow-x:auto;scrollbar-width:none}
#reacts button{width:38px;height:38px;flex:none;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--ink);font-size:20px;padding:0;transition:transform .1s;line-height:1}
#reacts button:hover{transform:translateY(-3px) scale(1.12) rotate(-6deg)}
#reacts button:active{transform:scale(.88)}
#reacts.cool button{opacity:.5}

/* ---------- panneau de droite ---------- */
#side{width:300px;flex:none;display:flex;flex-direction:column;gap:12px;padding:6px 12px 12px 0;min-height:0}
.sbox{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:12px;min-height:0}
.sbox.grow{flex:1;display:flex;flex-direction:column}
.sbox h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sbox h3 small{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;opacity:.6}
#hist{list-style:none;margin:0;padding:0 4px 0 0;overflow-y:auto;flex:1;font-size:13px;min-height:80px}
#hist li{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:2px dashed rgba(18,16,43,.1);line-height:1.3}
#hist li .d{flex:none;width:13px;height:13px;border-radius:4px;border:2px solid var(--ink);margin-top:2px;background:#e4e4ee}
#hist li.new{animation:slidein .4s}
#hist li:first-child{font-weight:900}
@keyframes slidein{from{opacity:0;transform:translateX(24px);background:#fff3b0}}
.rrow{position:relative;display:flex;align-items:center;gap:8px;padding:6px 6px 8px;border-radius:12px;overflow:hidden}
.rrow + .rrow{margin-top:2px}
.rrow.cur{background:#fff3b0}
.rrow .rk{font-family:var(--display);width:24px;text-align:center;font-size:18px;flex:none}
.rrow .av{width:30px;height:30px;font-size:13px;border-width:2px}
.rrow .rn{flex:1;min-width:0;font-weight:900;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rn small{display:block;font-size:11.5px;opacity:.7;font-weight:800}
.rrow .rn small.hot{color:var(--r);opacity:1}
.rrow .rp{font-family:var(--display);font-size:21px;flex:none}
.rrow .prog{position:absolute;left:6px;right:6px;bottom:2px;height:4px;border-radius:4px;background:rgba(18,16,43,.1)}
.rrow .prog i{display:block;height:100%;border-radius:4px;background:var(--g);transition:width .6s}
#sideClose{display:none}
#sideBack{display:none}
@media (max-width:899px){
  #side{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);padding:12px;background:var(--bg);border-left:4px solid var(--ink);z-index:85;transform:translateX(105%);transition:transform .3s}
  #side.open{transform:none}
  #sideClose{display:block;align-self:flex-end}
  #sideBack.open{display:block;position:fixed;inset:0;background:rgba(18,16,43,.45);z-index:84}
}
@media (min-width:900px){ #sideBtn{display:none} }

/* ---------- main ---------- */
#handWrap{flex:none;padding:24px 10px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:visible;scrollbar-width:thin}
#hand{display:flex;justify-content:center;min-width:min-content;padding:0 8px;height:calc(var(--cw)*1.46 + 6px)}
#hand .card{cursor:pointer;transition:transform .15s,filter .2s,margin .2s}
#hand.myturn .card.ok{transform:translateY(-14px)}
#hand.myturn .card.ok:hover{transform:translateY(-24px) rotate(-2deg)}
#hand.myturn .card.ok{box-shadow:3px 3px 0 var(--ink),0 0 0 3px #fff,0 0 18px 4px rgba(255,255,255,.8)}
#hand.myturn .card.no{filter:brightness(.62) saturate(.7)}
#hand .card:hover{z-index:30}
#hand.spect{display:grid;place-items:center;color:#fff;text-shadow:2px 2px 0 var(--ink);font-weight:900}

/* ---------- cartes ---------- */
.card{--cc:#888;position:relative;width:var(--cw);height:calc(var(--cw)*1.46);flex:none;border-radius:calc(var(--cw)*.15);
  background:var(--cc);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 5px,transparent 5px 13px);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);overflow:hidden;user-select:none}
.card::before{content:'';position:absolute;inset:5%;border:2px solid rgba(255,255,255,.55);border-radius:calc(var(--cw)*.1)}
.c-r{--cc:var(--r)}.c-y{--cc:var(--y)}.c-g{--cc:var(--g)}.c-b{--cc:var(--b)}.c-k{--cc:var(--k)}
.card .mid{position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-10deg);background:#fff;border:3px solid var(--ink);border-radius:30%;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.card .mid span{font-family:var(--display);font-size:calc(var(--cw)*.40);line-height:1;color:var(--cc);-webkit-text-stroke:calc(var(--cw)*.025) var(--ink);paint-order:stroke fill}
.card.v-6 .mid span,.card.v-9 .mid span{text-decoration:underline;text-decoration-thickness:3px}
.card.v-S .mid span,.card.v-R .mid span{font-size:calc(var(--cw)*.44)}
.card.c-k .mid{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0)}
.card.c-k .mid span{color:#fff}
.card i{position:absolute;font-style:normal;font-family:var(--display);font-size:calc(var(--cw)*.19);color:#fff;-webkit-text-stroke:calc(var(--cw)*.018) var(--ink);paint-order:stroke fill;line-height:1}
.card .tl{top:7%;left:10%}.card .br{bottom:7%;right:10%;transform:rotate(180deg)}
.card.back{--cc:var(--ink);background:repeating-linear-gradient(45deg,#12102b 0 8px,#26226a 8px 16px)}
.card.back .mid{background:var(--yellow)}
.card.back .mid span{color:var(--blue);font-size:calc(var(--cw)*.27);-webkit-text-stroke:calc(var(--cw)*.02) var(--ink)}

/* ---------- lobby ---------- */
#lobby{position:absolute;inset:52px 0 0;background:var(--bg);overflow-y:auto;padding:10px 16px 30px;z-index:20;display:flex;justify-content:center;align-items:flex-start}
#lobby .panel{width:100%;max-width:520px}
#lobby h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 4px}
.bigcode{font-family:var(--display);font-size:46px;letter-spacing:6px;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);display:inline-block;padding:2px 16px;margin:6px 0 12px;cursor:pointer}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pchip{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px;background:#fff;box-shadow:2px 2px 0 var(--ink);font-weight:900;font-size:14px;animation:popin .3s}
.pchip .av{width:26px;height:26px;font-size:12px;border-width:2px}
.pchip button{border:0;background:none;font-weight:900;padding:0 0 0 4px;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed rgba(18,16,43,.2)}
.opt .txt{flex:1}.opt .txt b{display:block;font-size:15px}.opt .txt small{font-size:12px;opacity:.7;font-weight:700}
.switch{position:relative;width:52px;height:30px;flex:none;border:3px solid var(--ink);border-radius:999px;background:#ddd;cursor:pointer;transition:background .2s}

@keyframes freshglow{0%,70%{box-shadow:3px 3px 0 var(--ink),0 0 0 3px var(--yellow),0 0 22px 6px var(--yellow)}100%{}}

@media (max-height:700px){:root{--cw:clamp(48px,12vw,72px)}#reacts button{width:32px;height:32px;font-size:17px}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

<script src="/_sdk.js"></script>
<script>
'use strict';
/* =====================================================================
   UNO · édition ChadGang
   - Moteur de règles (officielles + options), bots, réseau via SDK du hub
   - L'hôte (1er joueur de la salle) fait foi : les autres envoient des
     intentions {t:'act'}, l'hôte valide et diffuse l'état complet versionné.
   ===================================================================== */

/* ---------------- Cartes ---------------- */
const COLORS = ['r','y','g','b'];
const CNAME = {r:'Rouge', y:'Jaune', g:'Vert', b:'Bleu', k:'Joker'};
const CHEX  = {r:'#ff4757', y:'#ffc312', g:'#20bf6b', b:'#1e90ff', k:'#1b1838'};
const CARDS = [];
for (const c of COLORS) {
  CARDS.push({c, v:'0'});
  for (let k = 0; k < 2; k++) {
    for (let n = 1; n <= 9; n++) CARDS.push({c, v:String(n)});
    CARDS.push({c, v:'S'}, {c, v:'R'}, {c, v:'D'});
  }
}
for (let k = 0; k < 4; k++) CARDS.push({c:'k', v:'W'}, {c:'k', v:'F'});
const LABEL = {S:'⊘', R:'⇄', D:'+2', W:'★', F:'+4'};
const VNAME = {S:'Passe ton tour', R:'Inversion', D:'+2', W:'Joker', F:'Super Joker +4'};
const lab = v => LABEL[v] || v;
const cardPts = id => { const v = CARDS[id].v; return (v==='W'||v==='F') ? 50 : (isNaN(+v) ? 20 : +v); };
const cardName = id => { const c = CARDS[id]; return c.c==='k' ? VNAME[c.v] : `${VNAME[c.v]||c.v} ${CNAME[c.c].toLowerCase()}`; };

/* ---------------- Utilitaires ---------------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function hueOf(id){ let h=0; for (const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h % 360; }
let myAvatar = null; const avMap = {};
const okUrl = u => typeof u === 'string' && /^https:\/\//.test(u) && u.length < 500;
function avatarOf(p){
  if (!p || p.bot) return null;
  const u = (typeof S !== 'undefined' && S && S.av && S.av[p.id]) || avMap[p.id] || p.avatar || (p.id === myId ? myAvatar : null);
  return okUrl(u) ? u : null;
}
function avHTML(p, cam){
  const ini = p.bot ? '🤖' : esc((p.name||'?').trim().charAt(0).toUpperCase() || '?');
  const url = avatarOf(p);
  return `<span class="av"${cam && !p.bot ? ` data-chadgang-id="${esc(p.id)}"` : ''} style="background:hsl(${hueOf(p.id)} 75% 52%)">${ini}${url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
}

const BOT_NAMES = ['Bot Kévin','Bot Josiane','Bot Jean-Mich','Bot Ginette','Bot Brandon','Bot Huguette','Bot Titouan','Bot Raymonde','Bot Kylian','Bot Mamie Lulu'];
const DEFAULT_OPTS = {stack:true, chal:true, noBlackEnd:true, target:500, speed:'normal'};

/* =====================================================================
   MOTEUR
   ===================================================================== */
const seatOf = (S,id) => S.players.findIndex(p => p.id === id);
const topCard = S => CARDS[S.disc[S.disc.length-1]];
const nextIdx = (S, from, k=1) => { const n = S.players.length; return (((from + S.dir*k) % n) + n) % n; };
const nameOf = (S,id) => { const p = S.players.find(p=>p.id===id); return p ? p.name : '???'; };
function log(S, txt, col){ S.log.push(col ? [txt, col] : txt); if (S.log.length > 30) S.log.splice(0, S.log.length - 30); }

function canPlay(S, cid){
  if (S.chal) return false;
  if (S.drawn != null && cid !== S.drawn) return false;
  const c = CARDS[cid];
  if (S.stack > 0) return c.v === 'D';
  if (c.c === 'k' && S.opts && S.opts.noBlackEnd !== false){
    const cur = S.players[S.turn];
    if (cur && S.hands[cur.id] && S.hands[cur.id].length === 1) return false; // pas le droit de finir sur un Joker
  }
  const t = topCard(S);
  return c.c === 'k' || c.c === S.color || c.v === t.v;
}

function drawN(S, i, n){
  const pid = S.players[i].id, hand = S.hands[pid], got = [];
  for (let k = 0; k < n; k++){
    if (!S.deck.length){
      if (S.disc.length > 1){
        const t = S.disc.pop(); S.deck = shuffle(S.disc); S.disc = [t];
        S.ev.push({k:'shuffle'}); log(S, '🔀 La pioche est remélangée');
      } else break;
    }
    const c = S.deck.pop(); hand.push(c); got.push(c);
  }
  if (hand.length > 1) S.said[pid] = false;
  if (got.length) S.ev.push({k:'draw', p:pid, n:got.length});
  return got;
}
function advance(S, k){ S.turn = nextIdx(S, S.turn, k); S.drawn = null; S.turnAt = Date.now(); }
function clearVuln(S, pid){ if (S.vuln && S.vuln !== pid) S.vuln = null; }

function lobbyState(prev){
  return {
    v: (prev ? prev.v : 0) + 1, phase:'lobby',
    opts: Object.assign({}, DEFAULT_OPTS, lsGet('uno-opts', {}), prev ? prev.opts : {}),
    bots: prev ? prev.bots : [], av: prev && prev.av ? prev.av : {}, players: [], scores: {}, log: [], ev: [], round: 0
  };
}

function startRound(S, players){
  S.players = players; S.round = (S.round||0) + 1; S.dir = 1; S.stack = 0; S.chal = null;
  S.vuln = null; S.drawn = null; S.said = {}; S.winner = null; S.roundPts = 0;
  S.ev = [{k:'deal'}];
  let deck = shuffle([...Array(CARDS.length).keys()]);
  S.hands = {};
  for (const p of players){ S.hands[p.id] = deck.splice(0, 7); if (S.scores[p.id] == null) S.scores[p.id] = 0; }
  let first;
  for (;;){ first = deck.pop(); if (CARDS[first].v !== 'F') break; deck.unshift(first); shuffle(deck); }
  S.deck = deck; S.disc = [first];
  const c = CARDS[first], n = players.length, dealer = (S.round - 1) % n;
  S.turn = (dealer + 1) % n;
  S.color = c.c === 'k' ? pick(COLORS) : c.c;
  S.phase = 'play'; S.turnAt = Date.now();
  log(S, `🃏 Manche ${S.round} : on retourne ${cardName(first)}${c.c==='k' ? ' → '+CNAME[S.color] : ''}`);
  if (c.v === 'S'){ S.ev.push({k:'skip', p:players[S.turn].id}); log(S, `⊘ ${players[S.turn].name} passe son tour d'entrée`); S.turn = nextIdx(S, S.turn); }
  else if (c.v === 'R'){ if (n === 2) S.turn = nextIdx(S, S.turn); else { S.dir = -1; S.turn = dealer; S.ev.push({k:'rev', dir:-1}); } }
  else if (c.v === 'D'){ log(S, `💥 ${players[S.turn].name} pioche 2 d'entrée`); drawN(S, S.turn, 2); S.turn = nextIdx(S, S.turn); }
}

function endRound(S, wi){
  const wid = S.players[wi].id; let tot = 0;
  for (const p of S.players) if (p.id !== wid) tot += S.hands[p.id].reduce((a,c) => a + cardPts(c), 0);
  S.scores[wid] = (S.scores[wid]||0) + tot;
  S.roundPts = tot; S.winner = wid; S.chal = null; S.vuln = null; S.stack = 0; S.drawn = null;
  const over = S.opts.target === 0 || S.scores[wid] >= S.opts.target;
  S.phase = over ? 'gameEnd' : 'roundEnd';
  S.ev.push({k:'win', p:wid, pts:tot, over});
  log(S, `🏆 ${S.players[wi].name} remporte la manche (+${tot} pts)`);
}

/* Applique une action d'un joueur. Renvoie le nouvel état ou null si invalide. */
function act(S0, pid, a){
  if (!S0 || !a) return null;
  const S = clone(S0); S.ev = [];
  if (!doAct(S, pid, a)) return null;
  S.v = S0.v + 1;
  return S;
}
function doAct(S, pid, a){
  if (S.phase !== 'play') return false;
  const i = seatOf(S, pid); if (i < 0) return false;
  const me = S.players[i], hand = S.hands[pid];
  switch (a.t){
    case 'play': {
      if (i !== S.turn || S.chal) return false;
      const cid = a.c;
      if (!hand.includes(cid) || !canPlay(S, cid)) return false;
      const card = CARDS[cid];
      if (card.c === 'k' && !COLORS.includes(a.col)) return false;
      clearVuln(S, pid);
      const prev = S.color;
      const hadOther = hand.some(x => x !== cid && CARDS[x].v !== 'F' && canPlay(S, x)); // il pouvait jouer autre chose ?
      hand.splice(hand.indexOf(cid), 1);
      S.disc.push(cid); S.color = card.c === 'k' ? a.col : card.c; S.drawn = null;
      S.ev.push({k:'play', p:pid, c:cid, col:S.color});
      log(S, `${me.name} pose ${cardName(cid)}${card.c==='k' ? ' → '+CNAME[S.color] : ''}`, card.c === 'k' ? 'k' + S.color : S.color);
      if (hand.length === 1){
        if (S.said[pid]){ S.ev.push({k:'uno', p:pid}); log(S, `📣 ${me.name} : « UNO ! »`); }
        else { S.vuln = pid; S.vulnAt = Date.now(); }
      }
      const n = S.players.length, nx = nextIdx(S, i), win = hand.length === 0, nxp = S.players[nx];
      switch (card.v){
        case 'S': S.ev.push({k:'skip', p:nxp.id}); log(S, `⊘ ${nxp.name} passe son tour`); advance(S, 2); break;
        case 'R':
          if (n === 2){ S.ev.push({k:'skip', p:nxp.id, rev:true}); advance(S, 2); }
          else { S.dir *= -1; S.ev.push({k:'rev', dir:S.dir}); advance(S, 1); }
          break;
        case 'D':
          if (S.opts.stack){ S.stack += 2; S.ev.push({k:'stack', n:S.stack, p:pid}); advance(S, 1); }
          else { S.ev.push({k:'plus', n:2, p:nxp.id}); log(S, `💥 ${nxp.name} pioche 2 et passe`); drawN(S, nx, 2); advance(S, 2); }
          break;
        case 'W': S.ev.push({k:'wild', col:S.color}); advance(S, 1); break;
        case 'F':
          S.ev.push({k:'wild4', col:S.color, p:nxp.id});
          if (S.opts.chal && !win){ S.chal = {from:i, to:nx, legal:!hadOther}; S.turn = nx; S.drawn = null; S.turnAt = Date.now(); }
          else { log(S, `💀 ${nxp.name} pioche 4 et passe`); drawN(S, nx, 4); advance(S, 2); }
          break;
        default: advance(S, 1);
      }
      if (win){
        if (S.stack > 0){ log(S, `💀 ${S.players[S.turn].name} se prend le cumul de +${S.stack}`); drawN(S, S.turn, S.stack); S.stack = 0; }
        endRound(S, i);
      }
      return true;
    }
    case 'draw': {
      if (i !== S.turn || S.chal || S.drawn != null) return false;
      clearVuln(S, pid);
      if (S.stack > 0){
        const k = S.stack; S.stack = 0;
        drawN(S, i, k); S.ev.push({k:'take', p:pid, n:k});
        log(S, `💀 ${me.name} se prend +${k} !`); advance(S, 1); return true;
      }
      const got = drawN(S, i, 1);
      if (got.length && canPlay(S, got[0])){ S.drawn = got[0]; log(S, `${me.name} pioche… et peut jouer`); }
      else { log(S, `${me.name} pioche et passe`); advance(S, 1); }
      return true;
    }
    case 'pass': {
      if (i !== S.turn || S.drawn == null) return false;
      log(S, `${me.name} garde sa carte et passe`); advance(S, 1); return true;
    }
    case 'accept': {
      if (!S.chal || S.chal.to !== i) return false;
      S.chal = null; drawN(S, i, 4); S.ev.push({k:'take', p:pid, n:4});
      log(S, `💀 ${me.name} encaisse le +4`); advance(S, 1); return true;
    }
    case 'contest': {
      if (!S.chal || S.chal.to !== i) return false;
      const f = S.chal.from, fp = S.players[f];
      if (!S.chal.legal){
        S.chal = null; drawN(S, f, 4); S.ev.push({k:'busted', p:fp.id, by:pid});
        log(S, `🕵️ Bluff démasqué ! ${fp.name} pioche 4`); S.turnAt = Date.now();
      } else {
        S.chal = null; drawN(S, i, 6); S.ev.push({k:'contestFail', p:pid, from:fp.id});
        log(S, `😬 ${fp.name} était réglo : ${me.name} pioche 6`); advance(S, 1);
      }
      return true;
    }
    case 'uno': {
      if (hand.length === 1 && S.vuln === pid){ S.vuln = null; S.said[pid] = true; S.ev.push({k:'uno', p:pid}); log(S, `📣 ${me.name} : « UNO ! » (juste à temps)`); return true; }
      return false;
    }
    case 'catch': {
      const t = a.p; if (!S.vuln || S.vuln !== t || t === pid) return false;
      const ti = seatOf(S, t); if (ti < 0) return false;
      S.vuln = null; drawN(S, ti, 2); S.ev.push({k:'caught', p:t, by:pid});
      log(S, `🫵 ${me.name} a grillé ${S.players[ti].name} : pas dit UNO, +2 !`); return true;
    }
  }
  return false;
}

/* ---------------- Bots ---------------- */
function bestColor(hand){
  const cnt = {r:0,y:0,g:0,b:0};
  for (const c of hand){ const cc = CARDS[c].c; if (cc !== 'k') cnt[cc] += 1 + (isNaN(+CARDS[c].v) ? .5 : 0); }
  const best = Object.entries(cnt).sort((a,b) => b[1]-a[1]);
  return best[0][1] > 0 ? best[0][0] : pick(COLORS);
}
function botMove(S, pid){
  const i = seatOf(S, pid); if (i < 0) return null;
  const hand = S.hands[pid];
  if (S.chal){ if (S.chal.to !== i) return null; return {t: Math.random() < .27 ? 'contest' : 'accept'}; }
  if (i !== S.turn) return null;
  const mk = c => ({t:'play', c, col: CARDS[c].c==='k' ? bestColor(hand.filter(x => x!==c)) : undefined});
  if (S.drawn != null) return canPlay(S, S.drawn) ? mk(S.drawn) : {t:'pass'};
  const playable = hand.filter(c => canPlay(S, c));
  if (!playable.length) return {t:'draw'};
  const nx = S.players[nextIdx(S, i)], danger = S.hands[nx.id].length <= 2;
  const cnt = {r:0,y:0,g:0,b:0}; for (const c of hand){ const cc = CARDS[c].c; if (cc !== 'k') cnt[cc]++; }
  const hasOther = playable.some(c => CARDS[c].v !== 'F');
  let best = null, bs = -1e9;
  for (const c of playable){
    const k = CARDS[c]; let s;
    if (k.c === 'k') s = k.v === 'W' ? 3 : (hasOther ? -4 : 1);
    else {
      s = 10 + cnt[k.c]*1.6;
      if (isNaN(+k.v)) s += danger ? 14 : 2; else s += (+k.v)/3;
    }
    if (danger && k.v === 'F') s += 14;
    if (hand.length <= 2 && k.c === 'k') s += 6;
    s += Math.random()*2.5;
    if (s > bs){ bs = s; best = c; }
  }
  return mk(best);
}

const params = new URLSearchParams(location.search);
const AUTOPLAY = params.has('autoplay');
const TURBO = params.has('turbo');
const SDK = window.ChadGang || null;

let mode = null;          // 'solo' | 'online'
let S = null;             // état courant
let myId = 'me', myName = 'Toi';
let presence = [];        // [{id,name}] joueurs connectés à la salle
let room = null, roomCode = null;
let pendingAct = 0, summaryTimer = null, summaryClosed = false, fresh = {ids:new Set(), until:0};
let hostTimers = [];

const isHost = () => mode === 'solo' || (presence.length > 0 && presence[0].id === myId);
const present = id => mode !== 'online' || presence.some(p => p.id === id);
const isAuto = p => p.bot || !present(p.id) || (AUTOPLAY && p.id === myId);

function receive(ns, silent){
  if (!ns) return;
  if (S && ns.v <= S.v) return;
  const old = S;
  const pre = captureRects(ns);
  const oldHand = old && old.hands && old.hands[myId] && old.phase === 'play' ? old.hands[myId] : null;
  S = ns; pendingAct = 0;
  if (!old || old.phase !== S.phase) summaryClosed = false;
  // l'hôte a lancé la suite : on ferme le résumé chez tout le monde
  if (old && old.phase !== S.phase && (old.phase === 'roundEnd' || old.phase === 'gameEnd')){ clearTimeout(summaryTimer); closeModal(); }
  // cartes que je viens de recevoir
  const h = myHand();
  if (!silent && h && oldHand && S.ev && S.ev.some(e => e.k === 'draw' && e.p === myId)){
    const got = h.filter(c => !oldHand.includes(c));
    if (got.length){ fresh = {ids:new Set(got), until:Date.now() + 3200}; pre.got = got; }
  }
  if (!silent && S.vuln === myId && (!old || old.vuln !== myId)) toast('⚠️ Plus qu\'une carte : clique vite sur UNO !');
  render();
  if (!silent && S.ev && S.ev.length) runFx(S.ev, pre, old);
  else if (!silent) turnPing(old);
  if ((S.phase === 'roundEnd' || S.phase === 'gameEnd') && !summaryClosed){
    clearTimeout(summaryTimer);
    summaryTimer = setTimeout(() => { if (S && (S.phase==='roundEnd'||S.phase==='gameEnd') && !summaryClosed) showSummary(); }, silent ? 50 : 2200);
  }
  reportGameEnd();
  if (isHost()) scheduleHost();
}

/* Classement « all time » du hub : chaque joueur envoie SON résultat, une seule fois par partie terminée */
function reportGameEnd(){
  if (mode !== 'online' || !S || S.phase !== 'gameEnd' || !S.gameId) return;
  if (!(window.ChadGang && ChadGang.finPartie)) return;
  const me = S.players.find(p => p.id === myId && !p.bot); if (!me) return;
  const done = lsGet('uno-reported', []);
  const key = S.gameId + '|' + myId;
  if (done.includes(key)) return;
  lsSet('uno-reported', done.concat(key).slice(-50));
  const best = Math.max(...S.players.filter(p => !p.bot).map(p => S.scores[p.id] || 0), ...S.players.filter(p => p.bot).map(p => S.scores[p.id] || 0));
  const mine = S.scores[myId] || 0;
  try { ChadGang.finPartie({gagne: mine >= best, partie: S.gameId, score: mine}).catch(() => {}); } catch(e){}
}

function commit(ns){
  if (!ns) return;
  if (mode === 'online' && room){
    ns.av = Object.assign({}, avMap, ns.av || {});
    for (const k of Object.keys(ns.av)) if (!okUrl(ns.av[k])) delete ns.av[k];
    while (JSON.stringify(ns).length > 11500 && ns.log.length > 3) ns.log.shift();
    try { room.send({t:'state', s:ns}, {keep:true}); } catch(e){ console.warn(e); }
  } else if (mode === 'solo') {
    if (ns.phase === 'play' || ns.phase === 'roundEnd') lsSet('uno-solo', ns); else lsDel('uno-solo');
  }
  receive(ns, false);
  if (isHost()) botReact(ns);
}

/* Le joueur local fait une action */
function sendAct(a){
  if (!S) return;
  if (isHost()){
    const ns = act(S, myId, a);
    if (ns) commit(ns); else toast('Coup impossible 🤔');
    return;
  }
  if (Date.now() - pendingAct < 1500 && ['play','draw','pass','accept','contest'].includes(a.t)) return;
  pendingAct = Date.now();
  try { room.send({t:'act', a, v:S.v}); } catch(e){}
}
/* L'hôte reçoit une action d'un autre joueur */
function hostHandle(pid, a, v){
  if (!S || !a) return;
  if (['draw','pass','accept','contest'].includes(a.t) && v !== S.v) return;
  const ns = act(S, pid, a);
  if (ns) commit(ns);
}

/* L'hôte fait jouer bots, absents, et gère les « Contre-Uno » des bots */
function scheduleHost(){
  hostTimers.forEach(clearTimeout); hostTimers = [];
  if (!S || !isHost()) return;
  if (AUTOPLAY && S.phase !== 'play'){ // mode test : enchaîne tout seul
    const v0 = S.v;
    hostTimers.push(setTimeout(() => { if (!S || S.v !== v0) return; closeModal(); window.__games = (window.__games||0) + (S.phase==='gameEnd'?1:0);
      if (S.phase === 'roundEnd') hostNextRound(); else if (S.phase === 'gameEnd'){ hostBackToLobby(); setTimeout(hostStart, 50); } }, TURBO ? 60 : 2500));
    return;
  }
  if (S.phase !== 'play') return;
  const sp = TURBO ? [15,30] : ({slow:[1500,2300], normal:[850,1450], fast:[380,650]}[S.opts.speed] || [850,1450]);
  const cur = S.players[S.turn];
  const v = S.v;
  const later = (ms, fn) => hostTimers.push(setTimeout(() => { if (S && S.v === v && S.phase === 'play') fn(); }, ms));
  if (cur && isAuto(cur)){
    // si quelqu'un vient de passer à 1 carte, on laisse ~3 s pour crier UNO / Contre-Uno
    const unoWait = S.vuln && S.vuln !== cur.id ? Math.max(0, 3000 - (Date.now() - (S.vulnAt || 0))) : 0;
    later(Math.max(unoWait, rnd(sp[0], sp[1]) + (S.ev && S.ev.some(e => ['wild4','stack','win','deal','caught','busted'].includes(e.k)) ? 700 : 0)), () => {
      const ns = act(S, cur.id, botMove(S, cur.id)); if (ns) commit(ns);
    });
  } else if (cur && mode === 'online'){
    // joueur trop lent : au bout de 60 s, on joue pour lui
    const left = Math.max(1000, 60000 - (Date.now() - (S.turnAt||Date.now())));
    later(left, () => { log(S, `⏰ ${cur.name} dort… le bot joue à sa place`); const ns = act(S, cur.id, botMove(S, cur.id)); if (ns) commit(ns); });
  }
  if (S.vuln){
    const vp = S.players[seatOf(S, S.vuln)];
    if (vp && isAuto(vp) && Math.random() < .85){
      later(TURBO ? 10 : rnd(700, 2600), () => { const ns = act(S, vp.id, {t:'uno'}); if (ns) commit(ns); });
    }
    const bots = S.players.filter(p => p.bot && p.id !== S.vuln);
    if (bots.length && Math.random() < .7){
      later(TURBO ? 12 : rnd(1300, 3000), () => { const b = pick(bots); const ns = act(S, b.id, {t:'catch', p:S.vuln}); if (ns) commit(ns); });
    }
  }
}

/* ---------------- Actions d'hôte (lobby, manches) ---------------- */
function lobbyPlayers(L){
  const humans = mode === 'online' ? presence.map(p => ({id:p.id, name:p.name})) : [{id:myId, name:myName}];
  return humans.slice(0, 8).concat(L.bots).slice(0, 8);
}
function hostLobbyRefresh(force){
  if (!isHost() || !S || S.phase !== 'lobby') return;
  const np = lobbyPlayers(S);
  if (!force && JSON.stringify(np) === JSON.stringify(S.players)) return;
  const L = clone(S); L.players = np; L.v++; L.ev = []; commit(L);
}
function hostUpdate(fn){ if (!isHost() || !S) return; const L = clone(S); L.ev = []; fn(L); L.v = S.v + 1; commit(L); }
function addBot(){
  hostUpdate(L => {
    if (L.players.length >= 8) return;
    const used = new Set(L.bots.map(b => b.name));
    const name = BOT_NAMES.find(n => !used.has(n)) || ('Bot ' + (L.bots.length+1));
    L.bots.push({id:'bot-' + Math.random().toString(36).slice(2,8), name, bot:true});
    L.players = lobbyPlayers(L);
  });
}
function rmBot(id){ hostUpdate(L => { L.bots = L.bots.filter(b => b.id !== id); L.players = lobbyPlayers(L); }); }
function setOpt(k, val){ hostUpdate(L => { L.opts[k] = val; lsSet('uno-opts', L.opts); }); }
function hostStart(){
  hostUpdate(L => {
    const pl = lobbyPlayers(L);
    if (pl.length < 2) return;
    L.scores = {}; L.round = 0; L.log = [];
    L.gameId = (String(roomCode || 'SOLO') + '-' + Date.now().toString(36)).replace(/[^A-Za-z0-9\-_.:]/g, '').slice(0, 64);
    startRound(L, pl);
  });
}
function hostNextRound(){
  hostUpdate(L => {
    const want = lobbyPlayers(L);
    // on garde l'ordre des places, on ajoute les nouveaux à la fin
    const order = L.players.filter(p => want.some(w => w.id === p.id)).map(p => want.find(w => w.id === p.id));
    for (const w of want) if (!order.some(o => o.id === w.id)) order.push(w);
    startRound(L, order.slice(0, 8));
  });
}
function hostBackToLobby(){
  if (!isHost() || !S) return;
  const L = lobbyState(S); L.v = S.v + 1; L.players = lobbyPlayers(L); commit(L);
}

/* ---------------- Connexion ---------------- */
function startSolo(resume){
  mode = 'solo'; myId = 'me'; myName = pseudo();
  const saved = resume ? lsGet('uno-solo', null) : null;
  showGame();
  if (saved && saved.players && saved.players.some(p => p.id === 'me')){
    S = null; receive(saved, true);
  } else {
    const L = lobbyState(null);
    if (!L.bots.length) for (let k = 0; k < 3; k++){ const name = BOT_NAMES[k]; L.bots.push({id:'bot-'+k, name, bot:true}); }
    L.players = lobbyPlayers(L);
    S = null; receive(L, true);
  }
}
function genCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let k=0;k<4;k++) s += A[Math.floor(Math.random()*A.length)]; return s; }
function joinRoom(code, create){
  if (!SDK){ toast('Le mode en ligne marche dans le hub ChadGang'); return; }
  code = String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  if (code.length < 4){ toast('Code de 4 caractères minimum'); return; }
  mode = 'online'; roomCode = code; S = null; presence = [];
  try { room = SDK.join(code, {create}); } catch(e){ toast('Impossible de rejoindre 😢'); return; }
  showGame();
  room.on('ready', info => {
    myId = info.me; presence = info.players || [];
    const me = presence.find(p => p.id === myId); if (me) myName = me.name;
    if (myAvatar){ avMap[myId] = myAvatar; try { room.send({t:'av', url:myAvatar}); } catch(e){} }
    if (info.last && info.last.t === 'state' && info.last.s){ receive(info.last.s, true); }
    if (!S && isHost()){ const L = lobbyState(null); L.players = lobbyPlayers(L); commit(L); }
    hostLobbyRefresh();
    render();
  });
  room.on('players', list => {
    const before = presence.map(p => p.id);
    const wasHost = isHost();
    presence = list || [];
    if (myAvatar && presence.some(p => !before.includes(p.id) && p.id !== myId)){ try { room.send({t:'av', url:myAvatar}); } catch(e){} }
    for (const p of presence) if (!before.includes(p.id) && before.length && p.id !== myId && S && S.phase !== 'lobby') toast(`👋 ${p.name} débarque`);
    if (!S && isHost()){ const L = lobbyState(null); L.players = lobbyPlayers(L); commit(L); }
    hostLobbyRefresh();
    if (isHost()) scheduleHost();
    render();
    if (!wasHost && isHost()){ toast('👑 Tu es maintenant l\'hôte'); if (S && (S.phase==='roundEnd'||S.phase==='gameEnd') && !$('#modal').classList.contains('hidden')) showSummary(); }
  });
  room.on('message', (d, from) => {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'state') receive(d.s, false);
    else if (d.t === 'av'){
      if (!from || !okUrl(d.url) || avMap[from.id] === d.url) { if (from && okUrl(d.url) && isHost() && S && (!S.av || S.av[from.id] !== d.url)) hostUpdate(L => { L.av = Object.assign({}, L.av, {[from.id]: d.url}); }); return; }
      avMap[from.id] = d.url;
      if (isHost() && S) hostUpdate(L => { L.av = Object.assign({}, L.av, {[from.id]: d.url}); });
      else render();
    }
    else if (d.t === 'act'){ if (isHost() && from && from.id !== myId) hostHandle(from.id, d.a, d.v); }
    else if (d.t === 'emo'){
      let pid = from && from.id;
      if (d.p){ if (!presence[0] || !from || from.id !== presence[0].id || !S || !S.players.some(p => p.id === d.p && p.bot)) return; pid = d.p; }
      showEmote(pid, d.e);
    }
  });
  room.on('error', msg => { toast('😬 ' + (msg || 'Erreur de salle')); setTimeout(goHome, 1600); });
}
function leave(){
  hostTimers.forEach(clearTimeout); hostTimers = [];
  if (room){ try { room.leave(); } catch(e){} }
  room = null; mode = null; S = null; presence = []; roomCode = null;
}
function goHome(){ leave(); closeModal(); $('#game').classList.add('hidden'); $('#home').classList.remove('hidden'); refreshHome(); }
function showGame(){ $('#home').classList.add('hidden'); $('#game').classList.remove('hidden'); render(); }
function pseudo(){ const v = $('#pseudo').value.trim(); if (v) lsSet('uno-pseudo', v); return v || 'Toi'; }

const backHTML = (cls='') => `<div class="card back ${cls}"><b class="mid"><span>CG</span></b></div>`;
const myHand = () => S && S.hands && S.hands[myId] ? S.hands[myId] : null;
function sortHand(h){
  const co = {r:0,y:1,g:2,b:3,k:4}, vo = v => isNaN(+v) ? ({S:10,R:11,D:12,W:13,F:14}[v]) : +v;
  return [...h].sort((a,b) => (co[CARDS[a].c]-co[CARDS[b].c]) || (vo(CARDS[a].v)-vo(CARDS[b].v)) || a-b);
}
function orderedOpps(){
  if (!S || !S.players) return [];
  const i = seatOf(S, myId);
  if (i < 0) return S.players.slice();
  const out = [];
  for (let k = 1; k < S.players.length; k++) out.push(S.players[(((i + S.dir*k) % S.players.length) + S.players.length) % S.players.length]);
  return out;
}

    catch(e){ toast('Raté, utilise le bouton Inviter du hub'); }

}

/* Place les joueurs autour de la table (moi en bas, les autres dans le sens horaire) */
let G = null, spotAngle = null;
function layoutTable(){
  const t = $('#table'), W = t.clientWidth, H = t.clientHeight;
  const small = W < 560, sw = small ? 90 : 170, sh = small ? 84 : 64;
  let fw = Math.min(W - sw * 1.05, 700), fh = Math.min(H - sh * 1.45, W < H ? fw * 1.45 : fw * .66);
  fw = Math.max(fw, 170); fh = Math.max(fh, 130);
  if (fw > fh * 1.9) fw = fh * 1.9;
  const cx = W / 2, cy = H / 2;
  const f = $('#felt');
  Object.assign(f.style, {left:(cx - fw/2)+'px', top:(cy - fh/2)+'px', width:fw+'px', height:fh+'px'});
  const pw = Math.max(48, Math.min(112, fh * .36, fw * .21));
  f.style.setProperty('--pw', pw + 'px');
  drawDirRing(fw, fh);
  G = {W, H, cx, cy, rx: fw/2 + sw*.1, ry: fh/2 + sh*.2, sw, sh};
  return G;
}
/* Anneau du sens de jeu : une ellipse fixe dont les pointillés et les flèches défilent */
let dirKey = '';
function drawDirRing(fw, fh){
  const d = S && S.dir < 0 ? -1 : 1, key = `${Math.round(fw)}x${Math.round(fh)}:${d}`;
  const box = $('#dir'); box.classList.toggle('ccw', d < 0);
  if (key === dirKey) return; dirKey = key;
  const w = fw - 10, h = fh - 10, cx = w/2, cy = h/2, rx = w/2 * .86, ry = h/2 * .84;
  const path = `M ${cx-rx},${cy} a ${rx},${ry} 0 1,1 ${2*rx},0 a ${rx},${ry} 0 1,1 ${-2*rx},0`;
  const arrows = [0, 1/3, 2/3].map(o => `<polygon class="arw" points="-7,-7 8,0 -7,7"><animateMotion dur="9s" repeatCount="indefinite" rotate="${d > 0 ? 'auto' : 'auto-reverse'}" keyPoints="${d > 0 ? `${o};1;0;${o}` : `${1-o};0;1;${1-o}`}" keyTimes="0;${(1-o).toFixed(3)};${(1-o).toFixed(3)};1" calcMode="linear" path="${path}"/></polygon>`).join('');
  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}"><path class="ring" d="${path}"/>${arrows}</svg>`;
}
function seatAngles(){
  const n = S.players.length, mi = seatOf(S, myId);
  if (mi < 0) return S.players.map((p, k) => ({p, a: 90 + k * 360 / n}));
  const out = [{p: S.players[mi], a: 90}];
  for (let k = 1; k < n; k++) out.push({p: S.players[(mi + k) % n], a: 150 + k * 240 / n});
  return out;
}
function renderSeats(){
  const g = layoutTable(), box = $('#seats');
  const curId = S.phase === 'play' && S.players[S.turn] ? S.players[S.turn].id : null;
  const hostId = mode === 'online' && presence[0] ? presence[0].id : null;
  let curPos = null;
  box.innerHTML = seatAngles().map(({p, a}) => {
    const rad = a * Math.PI / 180;
    let x = g.cx + g.rx * Math.cos(rad), y = g.cy + g.ry * Math.sin(rad);
    x = Math.max(g.sw/2 + 4, Math.min(g.W - g.sw/2 - 4, x));
    y = Math.max(g.sh/2 + 26, Math.min(g.H - g.sh/2 - 6, y));
    const n = (S.hands[p.id]||[]).length;
    const isTurn = p.id === curId, isMe = p.id === myId;
    if (isTurn) curPos = {x, y};
    const away = !p.bot && !present(p.id);
    const showUno = n === 1 && S.said[p.id];
    const canCatch = S.phase === 'play' && S.vuln === p.id && !isMe && seatOf(S, myId) >= 0;
    const tags = [p.bot ? '🤖 bot' : '', p.id === hostId ? '👑' : '', away ? '💤 absent' : ''].filter(Boolean).join(' ');
    let timer = '';
    if (isTurn && mode === 'online' && !p.bot && !away){
      const el = Math.max(0, Date.now() - (S.turnAt || Date.now()));
      timer = `<div class="tbar"><i style="animation-duration:60000ms;animation-delay:-${Math.min(el, 59000)}ms"></i></div>`;
    }
    const turnTxt = isMe ? 'À TOI !' : (S.chal && S.chal.to === seatOf(S, p.id) ? 'RÉPOND AU +4' : 'SON TOUR');
    return `<div class="seat ${isTurn?'turn':''} ${isMe?'me':''} ${away?'away':''} ${n>0 && n<=2 && S.phase==='play'?'danger':''}" data-pid="${esc(p.id)}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">
      ${isTurn ? `<div class="tag-turn">▼ ${turnTxt}</div>` : ''}
      <div class="avw">${avHTML(p, true)}<span class="cntb" title="${n} cartes">${n}</span></div>
      <div class="info">
        <div class="nm">${esc(isMe ? (p.name === 'Toi' ? 'Toi' : p.name + ' (toi)') : p.name)}</div>
        <div class="sub">${S.scores[p.id]||0} pts${tags ? ' · ' + tags : ''}</div>
        <div class="minis">${'<span class="mini"></span>'.repeat(Math.min(n, 8))}${n > 8 ? `<b>+${n-8}</b>` : ''}</div>
      </div>
      ${showUno ? '<span class="badge-uno">UNO</span>' : ''}
      ${canCatch ? `<button class="catch" data-catch="${esc(p.id)}">🫵 Contre-Uno !</button>` : ''}
      ${timer}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-catch]').forEach(b => b.onclick = () => { initAudio(); sendAct({t:'catch', p:b.dataset.catch}); });
  // projecteur vers le joueur dont c'est le tour
  const spot = $('#spot');
  if (curPos){
    let a = Math.atan2(curPos.y - g.cy, curPos.x - g.cx) * 180 / Math.PI + 90;
    if (spotAngle != null){ while (a - spotAngle > 180) a -= 360; while (a - spotAngle < -180) a += 360; }
    spotAngle = a; spot.style.rotate = a + 'deg'; spot.style.opacity = 1;
  } else spot.style.opacity = 0;
}

function renderSide(){
  const ids = S.players.map(p => p.id);
  const curId = S.phase === 'play' && S.players[S.turn] ? S.players[S.turn].id : null;
  const sorted = ids.slice().sort((a,b) => (S.scores[b]||0) - (S.scores[a]||0) || (S.hands[a]||[]).length - (S.hands[b]||[]).length);
  const tgt = S.opts.target || 0;
  $('#rankSub').textContent = tgt ? `premier à ${tgt}` : 'manche unique';
  $('#rank').innerHTML = sorted.map((id, k) => {
    const p = S.players.find(x => x.id === id), n = (S.hands[id]||[]).length, sc = S.scores[id]||0;
    const hot = S.phase === 'play' && n <= 2;
    return `<div class="rrow ${id===curId?'cur':''}">
      <span class="rk">${['🥇','🥈','🥉'][k] || (k+1)}</span>${avHTML(p)}
      <span class="rn">${esc(p.name)}${id===myId && p.name !== 'Toi' ?' (toi)':''}<small class="${hot?'hot':''}">${S.phase==='play' ? `🃏 ${n} carte${n>1?'s':''}${n===1?' · UNO !':''}` : ''}${id===curId ? ' · ▶ joue' : ''}</small></span>
      <span class="rp">${sc}</span>
      ${tgt ? `<span class="prog"><i style="width:${Math.min(100, sc/tgt*100).toFixed(1)}%"></i></span>` : ''}
    </div>`;
  }).join('');
  const L = (S.log||[]).slice().reverse();
  $('#histSub').textContent = `manche ${S.round||1}`;
  const hist = $('#hist'), prevTop = hist.dataset.top || '';
  const txt = l => Array.isArray(l) ? l[0] : l;
  let fresh = L.findIndex(l => txt(l) === prevTop); if (fresh < 0) fresh = prevTop ? Math.min(3, L.length) : 0;
  hist.innerHTML = L.map((l, k) => {
    const t = txt(l), c = Array.isArray(l) ? l[1] : null;
    let bg = '';
    if (c){ bg = c.length === 2 ? `background:conic-gradient(${CHEX.r} 0 25%,${CHEX.y} 0 50%,${CHEX.g} 0 75%,${CHEX.b} 0);box-shadow:inset 0 0 0 3px ${CHEX[c[1]]}` : `background:${CHEX[c]}`; }
    return `<li class="${k < fresh ? 'new' : ''}"><span class="d" style="${bg}"></span><span>${esc(t)}</span></li>`;
  }).join('') || '<li>La partie commence…</li>';
  hist.dataset.top = L.length ? txt(L[0]) : '';
}

function renderTable(){
  document.documentElement.style.setProperty('--cur', CHEX[S.color] || '#ffd426');
  const fe = $('#felt'); drawDirRing(fe.clientWidth + 10, fe.clientHeight + 10);
  const mi = seatOf(S, myId);
  const myTurn = S.phase === 'play' && mi === S.turn && !S.chal;
  const canDraw = myTurn && S.drawn == null;
  const deck = $('#deck');
  deck.classList.toggle('can', canDraw && !(myHand()||[]).some(c => canPlay(S, c)) || (canDraw && S.stack > 0));
  deck.innerHTML = backHTML() + backHTML() + backHTML() + `<span class="count">${S.deck.length} cartes</span>`;
  const pile = $('#pile');

  pile.innerHTML = last.map((c, k) => {
    const rot = ((c * 37) % 25) - 12, dx = ((c * 13) % 9) - 4;
    return cardHTML(c, k === last.length-1 ? 'top' : '').replace('class="card', `style="transform:translate(${dx}px,0) rotate(${rot}deg)" class="card`);
  }).join('') + (S.stack > 0 ? `<div id="stackBadge">+${S.stack} 🔥</div>` : '');
  $('#tinfo').innerHTML = `<span class="tchip"><span class="dot"></span>${CNAME[S.color]}</span><span class="tchip">${S.dir > 0 ? '↻ horaire' : '↺ anti-horaire'}</span>${S.stack > 0 ? `<span class="tchip hot">🔥 cumul +${S.stack}</span>` : ''}`;
  // statut
  const st = $('#status');
  let txt = '', mine = false, who = null, alert = false;

  else if (S.chal){

    who = to;

    else txt = `${esc(to.name)} se prend un +4… contestera ? 👀`;

      mine = true;
      if (S.stack > 0){ txt = `🔥 Cumul à +${S.stack} ! Pose un +2 ou prends tout`; alert = true; }
      else if (S.drawn != null) txt = 'Tu as pioché une carte jouable : pose-la ou passe';
      else txt = (myHand()||[]).some(c => canPlay(S,c)) ? 'À toi de jouer !' : 'Rien à poser… pioche !';
    } else txt = `⏳ Au tour de <b>${esc(cur.name)}</b>${cur.bot ? ' 🤖' : ''}`;
  }
  const key = txt + mine + alert;
  if (st.dataset.k !== key){ st.dataset.k = key; st.innerHTML = txt ? `<div class="pill ${mine ? (alert ? 'me alert' : 'me') : ''}">${who ? avHTML(who) : '<span class="av" style="background:var(--yellow)">🏆</span>'}<span>${mine && !alert && txt === 'À toi de jouer !' ? '🎯 <b>À TOI DE JOUER !</b>' : txt}</span></div>` : ''; }
}

function renderHand(){
  const hw = $('#hand'), h = myHand();
  if (!h){ hw.className = 'spect'; hw.innerHTML = S.phase === 'play' ? 'Tu joueras à la prochaine manche 🍿' : ''; return; }
  const mi = seatOf(S, myId);
  const myTurn = S.phase === 'play' && mi === S.turn && !S.chal;
  hw.className = myTurn ? 'myturn' : '';
  const sorted = sortHand(h);
  const W = $('#handWrap').clientWidth - 36;
  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || measureCw();
  const n = sorted.length;
  let step = n > 1 ? Math.min(cw * 0.78, (W - cw) / (n - 1)) : cw;
  step = Math.max(step, 22);
  const isFresh = c => Date.now() < fresh.until && fresh.ids.has(c);
  hw.innerHTML = sorted.map((c, k) => cardHTML(c, (myTurn ? (canPlay(S,c) ? 'ok' : 'no') : '') + (c === S.drawn ? ' ok' : '') + (isFresh(c) ? ' fresh' : ''))
    .replace('class="card', `style="margin-left:${k ? (step - cw).toFixed(1) : 0}px;z-index:${k+1}" class="card`)).join('');
  hw.querySelectorAll('.card').forEach(el => el.onclick = () => onCard(+el.dataset.id, el));
}
let _cw = 0;
function measureCw(){ if (_cw) return _cw; const d = document.createElement('div'); d.className = 'card'; d.style.visibility = 'hidden'; document.body.appendChild(d); _cw = d.getBoundingClientRect().width; d.remove(); return _cw; }

function renderActions(){
  const box = $('#actions'); let html = '';
  const h = myHand(), mi = seatOf(S, myId);

      html += `<button class="btn red" data-a="accept">😩 Encaisser +4</button><button class="btn" data-a="contest">🕵️ Contester !</button>`;
    } else if (myTurn && S.stack > 0){

  box.querySelectorAll('[data-catch]').forEach(b => b.onclick = () => { initAudio(); sendAct({t:'catch', p:b.dataset.catch}); });

    initAudio();
    sendAct({t:'uno'});
  };

}

/* ---------------- Interactions ---------------- */
function onCard(cid, el){
  initAudio();
  if (!S || S.phase !== 'play') return;
  const mi = seatOf(S, myId);
  if (mi !== S.turn || S.chal){ wiggle(el); toast(S.chal && S.chal.to === mi ? 'Réponds d\'abord au +4 !' : 'Pas ton tour, patience 😤'); return; }
  if (!canPlay(S, cid)){ wiggle(el); sfx.nope(); toast(CARDS[cid].c === 'k' && myHand().length === 1 && S.opts.noBlackEnd !== false ? 'Interdit de finir sur un Joker : pioche ! 🚫' : S.stack > 0 ? `Pose un +2 ou prends +${S.stack}` : S.drawn != null ? 'Tu ne peux poser que la carte piochée' : 'Cette carte ne passe pas'); return; }
  const go = col => sendAct({t:'play', c:cid, col});
  if (CARDS[cid].c === 'k') pickColor(go); else go();
}
function wiggle(el){ if (el && el.animate) el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px) rotate(-3deg)'},{transform:'translateX(6px) rotate(3deg)'},{transform:'translateX(0)'}], {duration:260}); }
$('#deck').onclick = () => {
  initAudio();
  if (!S || S.phase !== 'play') return;
  const mi = seatOf(S, myId);
  if (mi !== S.turn || S.chal || S.drawn != null){ wiggle($('#deck')); return; }
  sendAct({t:'draw'});
};

const EMOS = ['😂','🔥','😱','😡','🤡','👏','😭','😎'];

/* Les bots réagissent aussi (c'est l'hôte qui décide) */
function botReact(ns){
  if (!ns || !ns.ev || !ns.players) return;
  const bots = ns.players.filter(p => p.bot); if (!bots.length) return;
  const others = id => bots.filter(b => b.id !== id);
  let who = null, e = null;
  for (const ev of ns.ev){
    const b = bots.find(p => p.id === ev.p);
    if ((ev.k === 'take' && ev.n >= 4) || ev.k === 'caught' || ev.k === 'contestFail' || ev.k === 'busted'){
      if (b && Math.random() < .6){ who = b; e = pick(['😡','😭','😱']); }
      else if (Math.random() < .4 && others(ev.p).length){ who = pick(others(ev.p)); e = pick(['😂','🤡','🔥']); }
    } else if (ev.k === 'wild4' && b && Math.random() < .5){ who = b; e = pick(['😱','😡']); }
    else if (ev.k === 'stack' && ev.n >= 6 && Math.random() < .5){ who = pick(bots); e = '🔥'; }
    else if (ev.k === 'uno' && Math.random() < .25 && others(ev.p).length){ who = pick(others(ev.p)); e = '😱'; }
    else if (ev.k === 'win'){ if (b){ who = b; e = '😎'; } else if (Math.random() < .6){ who = pick(bots); e = '👏'; } }
  }
  if (!who || !e) return;
  const id = who.id;
  setTimeout(() => {
    if (mode === 'online' && room){ try { room.send({t:'emo', e, p:id}); } catch(x){} }
    else if (mode === 'solo') showEmote(id, e);
  }, rnd(600, 1500));
}

function rectOf(el){ if (!el) return null; const r = el.getBoundingClientRect(); return {x:r.left, y:r.top, w:r.width, h:r.height}; }

function center(r){ return {x:r.x + r.w/2, y:r.y + r.h/2}; }

function flyCard(html, from, toEl, opts={}){
  const to = rectOf(toEl); if (!to || !from) return Promise.resolve();
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const el = wrap.firstElementChild; el.style.setProperty('--cw', to.w + 'px');
  el.style.width = to.w + 'px';
  $('#fx').appendChild(el);
  const fc = center(from), tc = center(to);
  const s0 = Math.max(.25, (from.w || to.w) / to.w);
  const rot = opts.rot ?? rnd(-25, 25);
  const anim = el.animate([
    {transform:`translate(${fc.x - to.w/2}px,${fc.y - to.h/2}px) scale(${s0}) rotate(${opts.rot0 ?? 0}deg)`},
    {transform:`translate(${(fc.x+tc.x)/2 - to.w/2}px,${Math.min(fc.y,tc.y) - to.h/2 - (opts.arc ?? 60)}px) scale(${(s0+1)/2*1.15}) rotate(${rot/2}deg)`, offset:.5},
    {transform:`translate(${tc.x - to.w/2}px,${tc.y - to.h/2}px) scale(1) rotate(${rot}deg)`}
  ], {duration:opts.dur || 430, delay:opts.delay || 0, easing:'cubic-bezier(.3,.7,.2,1)', fill:'both'});
  return new Promise(res => anim.onfinish = () => { el.remove(); res(); });
}
function flyTo(html, fromEl, toRect, opts={}){
  const from = rectOf(fromEl); if (!from || !toRect) return;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const el = wrap.firstElementChild; el.style.setProperty('--cw', from.w + 'px'); el.style.width = from.w + 'px';
  $('#fx').appendChild(el);
  const tc = center(toRect);
  el.animate([
    {transform:`translate(${from.x}px,${from.y}px) scale(1) rotate(0deg)`, opacity:1},
    {transform:`translate(${tc.x - from.w/2}px,${tc.y - from.h/2}px) scale(.35) rotate(${rnd(-40,40)}deg)`, opacity:.9}
  ], {duration:opts.dur || 380, delay:opts.delay || 0, easing:'cubic-bezier(.5,0,.3,1)', fill:'both'}).onfinish = () => el.remove();
}
function particles(x, y, color, count=18, power=1){

function shake(power=1){

/* confettis */
function confetti(n=200, dur=3800){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#ff4757','#ffc312','#20bf6b','#1e90ff','#ffffff','#ffd426'];
  const P = [];
  for (let k = 0; k < n; k++){
    const left = k % 2 === 0;
    P.push({x: left ? -10 : innerWidth + 10, y: innerHeight * rnd(.5, .95), vx: (left?1:-1) * rnd(4, 13), vy: -rnd(8, 18), w: rnd(6,12), h: rnd(10,18), r: rnd(0,6), vr: rnd(-.3,.3), c: pick(cols)});
  }
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P){ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = '#12102b'; ctx.lineWidth = 1.5;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r*2))); ctx.restore(); }
    if (t - t0 < dur) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

function runFx(ev, pre, old){
  const pileTop = () => document.querySelector('#pile .card.top');
  const deckEl = $('#deck .card:last-of-type') || $('#deck');
  let drawDelay = 0;
  for (const e of ev){
    switch (e.k){
      case 'play': {
        const top = pileTop(); if (!top) break;
        top.style.visibility = 'hidden';
        const from = pre.cards[e.c] || seatRect(e.p);
        const rot = (top.style.transform.match(/rotate\((-?[\d.]+)deg\)/) || [0,0])[1];
        sfx.whoosh();
        flyCard(cardHTML(e.c), from, top, {rot:+rot, rot0: e.p === myId ? 0 : rnd(-90,90)}).then(() => {
          const t = pileTop(); if (t){ t.style.visibility = ''; t.animate([{scale:'1.25'},{scale:'.94'},{scale:'1'}], {duration:280, easing:'ease-out'}); }
          const c = center(rectOf(top));

          particles(c.x, c.y, k.c === 'k' ? 'rainbow' : CHEX[k.c], k.c === 'k' || isNaN(+k.v) ? 26 : 14, k.c === 'k' ? 1.4 : 1);

      case 'rev': setTimeout(() => { banner('INVERSION !', e.dir < 0 ? 'Le sens change ↺' : 'Le sens change ↻', 'green'); sfx.rev();
        $('#dir').animate([{transform:'scale(1)', filter:'brightness(1)'},{transform:'scale(1.06)', filter:'brightness(2.5) drop-shadow(0 0 8px #fff)'},{transform:'scale(1)', filter:'brightness(1)'}], {duration:900, easing:'ease-out'}); }, 380); break;
      case 'stack': setTimeout(() => {

      case 'wild4': setTimeout(() => {
        const c = center(rectOf(pileTop()) || {x:innerWidth/2,y:innerHeight/2,w:0,h:0});
        ripple(CHEX[e.col], c.x, c.y); setTimeout(() => ripple('#12102b', c.x, c.y), 160);

        shake(2.4); flash('#fff', .7); sfx.mega(); particles(c.x, c.y, 'rainbow', 50, 2);
      }, 420); break;

        if (e.p !== myId && !ev.some(x => ['take','plus','caught','busted','contestFail'].includes(x.k) && x.p === e.p)) setTimeout(() => stamp(e.p, '+' + e.n, '#fff'), drawDelay + n*85);

      case 'caught': banner('CONTRE-UNO !', `${nameOf(S, e.by)} grille ${nameOf(S, e.p)} : +2 🫵`, 'red'); shake(1.3); sfx.buzz(); stamp(e.p, '🫵 +2', '#ff4757'); break;
      case 'busted': banner('BLUFF DÉMASQUÉ !', `${nameOf(S, e.p)} pioche 4 🕵️`, 'green'); shake(1.5); sfx.buzz(); stamp(e.p, '🤥 +4', '#ff4757'); break;

const colCls = c => ({r:'red', g:'green', b:'blue', y:''}[c] || '');

  const mineNow = (mi === S.turn) || (S.chal && S.chal.to === mi);
  const mineBefore = old && old.phase === 'play' && ((seatOf(old, myId) === old.turn) || (old.chal && old.chal.to === seatOf(old, myId)));
  if (mineNow && !mineBefore){ sfx.turn(); if (navigator.vibrate) try { navigator.vibrate(25); } catch(e){} }
}

/* ---------------- Sons (synthétisés, aucun fichier) ---------------- */
const SND = {ctx:null, on: !lsGet('uno-mute', false), master:null};
function initAudio(){
  if (!SND.on) return;
  try {
    if (!SND.ctx){ SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); SND.master = SND.ctx.createGain(); SND.master.gain.value = .55; SND.master.connect(SND.ctx.destination); }
    if (SND.ctx.state === 'suspended') SND.ctx.resume();
  } catch(e){}
}
function tone(f, d, type='sine', vol=.2, when=0, f2=null){
  if (!SND.on || !SND.ctx) return;
  const c = SND.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + d + .05);
}
function noise(d, vol=.2, when=0, freq=2000, type='bandpass'){
  if (!SND.on || !SND.ctx) return;
  const c = SND.ctx, t = c.currentTime + when, len = Math.floor(c.sampleRate * d);
  const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let k = 0; k < len; k++) data[k] = (Math.random()*2 - 1) * (1 - k/len);
  const s = c.createBufferSource(); s.buffer = buf;
  const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = freq;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(fl); fl.connect(g); g.connect(SND.master); s.start(t);
}
const sfx = {
  click(){ tone(660, .05, 'square', .06); },
  pop(){ tone(880, .08, 'sine', .12, 0, 1400); },
  whoosh(){ noise(.18, .14, 0, 1800); },
  slam(k){ noise(.08, .25, 0, 600, 'lowpass'); tone(k && k.c === 'k' ? 300 : 420, .09, 'triangle', .14); },
  draw(){ noise(.07, .1, 0, 3500, 'highpass'); },
  nope(){ tone(180, .12, 'square', .07); tone(140, .14, 'square', .07, .08); },
  skip(){ tone(520, .1, 'square', .08); tone(260, .22, 'square', .08, .09); },
  rev(){ tone(300, .35, 'sawtooth', .07, 0, 900); tone(900, .3, 'sawtooth', .05, .25, 300); },
  boom(n=2){ tone(140 - Math.min(n,12)*5, .5, 'sine', .4, 0, 40); noise(.35, .3, 0, 400, 'lowpass'); tone(300 + n*40, .15, 'square', .06, .05, 600 + n*60); },
  wild(){ [523,659,784,1047].forEach((f,k) => tone(f, .16, 'triangle', .1, k*.06)); },
  mega(){ tone(90, .9, 'sawtooth', .22, 0, 35); noise(.6, .4, 0, 300, 'lowpass'); [392,494,587,784,988].forEach((f,k) => tone(f, .2, 'square', .06, .15 + k*.07)); },
  ouch(n=2){ tone(400, .4, 'sawtooth', .08, 0, 120); if (n >= 6) tone(200, .6, 'sawtooth', .08, .2, 60); },
  uno(){ [523,659,784,1047,1319].forEach((f,k) => tone(f, .14, 'square', .07, k*.07)); tone(1568, .4, 'triangle', .12, .36); },
  buzz(){ tone(110, .45, 'sawtooth', .14); tone(116, .45, 'sawtooth', .14); },
  shuffle(){ for (let k = 0; k < 7; k++) noise(.05, .08, k*.045, 3000, 'highpass'); },
  turn(){ tone(880, .12, 'sine', .15); tone(1320, .2, 'sine', .12, .1); },
  win(big){ const m = [523,659,784,1047,784,1047,1319]; m.forEach((f,k) => tone(f, .22, 'square', .07, k*.11)); tone(1568, .8, 'triangle', .15, m.length*.11); if (big) noise(.8, .1, .3, 5000, 'highpass'); }
};
document.addEventListener('pointerdown', initAudio, {once:false, passive:true});

function refreshHome(){ $('#resumeBtn').classList.toggle('hidden', !lsGet('uno-solo', null)); }
(function buildFan(){
  const ids = [CARDS.findIndex(c=>c.c==='r'&&c.v==='7'), CARDS.findIndex(c=>c.c==='y'&&c.v==='R'), CARDS.findIndex(c=>c.v==='F'), CARDS.findIndex(c=>c.c==='g'&&c.v==='D'), CARDS.findIndex(c=>c.c==='b'&&c.v==='S')];
  $('#homeFan').innerHTML = ids.map((c,k) => cardHTML(c).replace('class="card', `style="transform:translateX(-50%) rotate(${(k-2)*14}deg)" class="card`)).join('');
})();
$('#soloBtn').onclick = () => { initAudio(); lsDel('uno-solo'); startSolo(false); };
$('#resumeBtn').onclick = () => { initAudio(); startSolo(true); };
$('#createBtn').onclick = () => { initAudio(); joinRoom(genCode(), true); };
$('#joinBtn').onclick = () => { initAudio(); joinRoom($('#code').value, true); };
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });
buildReacts();

(async function boot(){
  $('#pseudo').value = lsGet('uno-pseudo', '') || '';
  refreshHome();
  if (!SDK){
    $('#onlineHint').textContent = 'Le mode en ligne s\'active quand le jeu est ouvert depuis le hub ChadGang.';
    $('#onlineCtrls').style.opacity = .45; $('#createBtn').disabled = true; $('#joinBtn').disabled = true;
  } else {
    try { const me = await SDK.me(); if (me){ myName = me.name; if (okUrl(me.avatar)) myAvatar = me.avatar; if (!$('#pseudo').value) $('#pseudo').value = me.name; } } catch(e){}
    let code = null; try { code = SDK.room(); } catch(e){}
    if (code){ $('#code').value = code; joinRoom(code, true); return; }
  }
  if (params.has('solo') || AUTOPLAY){ startSolo(false); if (AUTOPLAY) setTimeout(hostStart, 100); }
})();
